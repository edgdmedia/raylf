<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/colors.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/typography.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/effects.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/icons.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/base.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/styles.css">
  <script src="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:#240145;}
    a{color:#fff3a8;text-decoration:none;transition:color .2s}
    a:hover{color:#f2b84b}
    [data-theme=dark]{--t-bg:#240145;--t-fg:#fff;--t-muted:rgba(255,255,255,.78);--t-line:rgba(255,243,168,.18);--t-gold:#f2b84b;--t-sec:radial-gradient(90% 60% at 80% 35%,#6a0da4 0%,#47017e 40%,#240145 100%);--t-chip:rgba(255,255,255,.06);--t-shadow:0 30px 80px rgba(10,0,25,.6);}
    [data-theme=light]{--t-bg:#faf8f5;--t-fg:#16121d;--t-muted:#3b3645;--t-line:rgba(53,30,93,.14);--t-gold:#a8761a;--t-sec:#efe6fb;--t-chip:#ffffff;--t-shadow:0 30px 80px rgba(30,15,56,.22);}
  </style>
</helmet>

<div data-theme="{{ theme }}" style="background:var(--t-bg);color:var(--t-fg);font-family:var(--font-body);overflow-x:clip;transition:background .4s cubic-bezier(.2,.7,.2,1),color .4s;">
  <dc-import name="RAYLF Nav" active="awards" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" style="position:sticky;top:0;z-index:50;display:block;" hint-size="100%,84px"></dc-import>

  <section data-screen-label="Awards Hero" style="position:relative;margin-top:-84px;min-height:86vh;display:flex;flex-direction:column;justify-content:flex-end;background:#240145;">
    <div style="position:absolute;inset:0;background-size:cover;background-position:center;background-image:url({{ ed.img }});transition:background-image .4s;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,1,69,.55) 0%,rgba(36,1,69,.4) 40%,rgba(36,1,69,.95) 85%,#240145 100%);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(50% 50% at 80% 30%,rgba(180,73,220,.4) 0%,rgba(180,73,220,0) 70%);"></div>
    <div style="position:relative;width:100%;max-width:1320px;margin:0 auto;padding:200px var(--container-pad) 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px;">
      <div style="display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);">
        <a href="RAYLF Website.dc.html" style="color:rgba(255,255,255,.7);">Home</a>
        <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
        <span style="color:#fff3a8;">RAYLF Awards</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;">
        <h1 style="margin:0;color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(52px,9vw,132px);line-height:.92;letter-spacing:-.04em;">RAYLF Awards <span style="background:var(--gradient-gold);-webkit-background-clip:text;background-clip:text;color:transparent;">{{ ed.year }}</span></h1>
        <span style="padding:8px 16px;border-radius:var(--radius-pill);border:1px solid rgba(255,243,168,.35);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff3a8;">{{ ed.tag }}</span>
      </div>
      <p style="margin:0;max-width:640px;font-size:19px;line-height:1.6;color:rgba(255,255,255,.85);text-wrap:pretty;">{{ ed.intro }}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.16);padding-top:24px;">
        <sc-for list="{{ yearTabs }}" as="y" hint-placeholder-count="4">
          <button onClick="{{ y.pick }}" style="padding:12px 24px;border-radius:var(--radius-pill);border:1px solid {{ y.border }};background:{{ y.bg }};color:{{ y.color }};font-family:var(--font-display);font-weight:600;font-size:16px;cursor:pointer;transition:all .25s;">{{ y.year }}</button>
        </sc-for>
      </div>
    </div>
  </section>

  <section id="awardees" data-screen-label="Awardees" style="padding:120px var(--container-pad);">
    <div style="max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:40px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.Eyebrow" tone="gold" hint-size="160px,18px">Awardees</x-import>
          <h2 style="margin:0;color:var(--t-fg);font-family:var(--font-display);font-weight:700;font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-.03em;">Class of {{ ed.year }}</h2>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <sc-for list="{{ catChips }}" as="c" hint-placeholder-count="5">
            <button onClick="{{ c.pick }}" style="padding:9px 18px;border-radius:var(--radius-pill);border:1px solid var(--t-line);background:{{ c.bg }};color:{{ c.color }};font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;transition:all .25s;">{{ c.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px;">
        <sc-for list="{{ awardees }}" as="a" hint-placeholder-count="8">
          <a href="Awardee.dc.html" style="display:block;transition:transform .35s cubic-bezier(.2,.7,.2,1);" style-hover="transform:translateY(-4px);">
            <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.AwardeeCard" photo="{{ a.photo }}" name="{{ a.name }}" category="{{ a.category }}" country="{{ a.country }}" year="{{ ed.year }}" hint-size="100%,320px"></x-import>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Ceremony" style="position:relative;padding:140px var(--container-pad);background:#240145;color:#fff;">
    <div style="max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:72px;align-items:center;">
      <div style="display:flex;flex-direction:column;gap:28px;">
        <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.Eyebrow" tone="light" hint-size="160px,18px">The Ceremony</x-import>
        <h2 style="margin:0;color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,4.5vw,60px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;">Presented under royal patronage.</h2>
        <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.RoyalQuote" tone="dark" size="lg" attribution="His Imperial Majesty (H.I.M) Ooni of Ife" hint-size="100%,140px">Young Africans are the spirit, soul and memory of Africa.</x-import>
        <div>
          <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.Button" variant="outline-light" href="Gallery.dc.html" icon-right="fa-solid fa-arrow-right" hint-size="160px,48px">Gallery</x-import>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:220px;gap:16px;">
        <div style="grid-row:span 2;border-radius:var(--radius-lg);background:url(assets/photos/award-certificate-01.jpg) center/cover;"></div>
        <div style="border-radius:var(--radius-lg);background:url(assets/photos/award-presentation-04.jpg) center/cover;"></div>
        <div style="border-radius:var(--radius-lg);background:url(assets/photos/award-certificate-02.jpg) center/cover;"></div>
      </div>
    </div>
  </section>

  <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.SiteFooter" hint-size="100%,320px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}">
class Component extends DCLogic {
  state = { theme: (() => { try { return localStorage.getItem('raylf-theme'); } catch (e) { return null; } })(), year: '2024', cat: 'All' };
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'dark';
    const light = theme === 'light';
    const editions = {
      '2024': { tag: 'Edition IV', img: 'assets/photos/award-stage-01.jpg' },
      '2022': { tag: 'Edition III', img: 'assets/photos/award-presentation-03.jpg' },
      '2021': { tag: 'Edition II', img: 'assets/photos/award-presentation-02.jpg' },
      '2020': { tag: 'Edition I', img: 'assets/photos/award-presentation-01.jpg' }
    };
    const year = this.state.year;
    const ed = { year, ...editions[year], intro: `The ${year} RAYLF Awards recognised young African leaders whose success stories are shaping, transforming and anchoring the future of the continent.` };
    const photos = ['assets/photos/speaker-portrait.jpg', 'assets/photos/award-greeting.jpg', 'assets/photos/award-presentation-01.jpg', 'assets/photos/award-presentation-04.jpg', 'assets/photos/award-certificate-03.jpg', 'assets/photos/award-presentation-02.jpg', 'assets/photos/award-certificate-01.jpg', 'assets/photos/award-presentation-03.jpg'];
    const people = [
      ['Awardee Name', 'Entrepreneurship', 'Nigeria'], ['Awardee Name', 'Public Service', 'Ghana'], ['Awardee Name', 'Creative Arts', 'Kenya'], ['Awardee Name', 'Technology', 'South Africa'],
      ['Awardee Name', 'Philanthropy', 'Nigeria'], ['Awardee Name', 'Entrepreneurship', 'Rwanda'], ['Awardee Name', 'Technology', 'Egypt'], ['Awardee Name', 'Creative Arts', 'Senegal']
    ];
    const cats = ['All', 'Entrepreneurship', 'Public Service', 'Creative Arts', 'Technology', 'Philanthropy'];
    const cat = this.state.cat;
    return {
      theme,
      toggleTheme: () => { const t = light ? 'dark' : 'light'; try { localStorage.setItem('raylf-theme', t); } catch (e) {} this.setState({ theme: t }); },
      ed,
      yearTabs: Object.keys(editions).map(y => {
        const on = y === year;
        return { year: y, pick: () => this.setState({ year: y, cat: 'All' }), bg: on ? '#fff3a8' : 'transparent', color: on ? '#240145' : '#fff', border: on ? '#fff3a8' : 'rgba(255,255,255,.35)' };
      }),
      catChips: cats.map(c => {
        const on = c === cat;
        return { label: c, pick: () => this.setState({ cat: c }), bg: on ? 'var(--t-gold)' : 'var(--t-chip)', color: on ? (light ? '#fff' : '#240145') : 'var(--t-fg)' };
      }),
      awardees: people.map(([name, category, country], i) => ({ name, category, country, photo: photos[i] })).filter(a => cat === 'All' || a.category === cat)
    };
  }
}
</script>
</body>
</html>
