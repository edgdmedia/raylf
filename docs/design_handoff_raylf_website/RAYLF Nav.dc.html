<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/styles.css">
  <script src="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/_ds_bundle.js"></script>
</helmet>
<header data-screen-label="Nav" style="padding:16px var(--container-pad);display:flex;justify-content:center;">
  <nav style="width:100%;max-width:1320px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 12px 10px 24px;border-radius:var(--radius-pill);background:rgba(36,1,69,.88);border:1px solid rgba(255,243,168,.16);box-shadow:0 12px 40px rgba(10,0,25,.45);box-sizing:border-box;">
    <a href="RAYLF Website.dc.html" style="display:flex;align-items:center;">
      <img src="assets/logo/raylf-logo-white.png" alt="RAYLF" style="height:40px;display:block;">
    </a>
    <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;">
      <sc-for list="{{ links }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="padding:10px 16px;border-radius:var(--radius-pill);font-family:var(--font-display);font-weight:500;font-size:14px;color:{{ n.color }};background:{{ n.bg }};" style-hover="background:rgba(255,255,255,.08);color:#fff3a8;">{{ n.label }}</a>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button onClick="{{ onToggleTheme }}" aria-label="Toggle light and dark mode" style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,243,168,.35);background:transparent;color:#fff3a8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;" style-hover="background:#fff3a8;color:#240145;"><i class="{{ themeIcon }}"></i></button>
      <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.Button" variant="gold" size="sm" href="Awards.dc.html#awardees" icon-right="fa-solid fa-arrow-right" hint-size="130px,40px">Awardees</x-import>
    </div>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;programmes&quot;,&quot;awards&quot;,&quot;gallery&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToggleTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const items = [
      ['home', 'Home', 'RAYLF Website.dc.html'],
      ['about', 'About', 'About.dc.html'],
      ['programmes', 'Programmes', 'Programmes.dc.html'],
      ['awards', 'Awards', 'Awards.dc.html'],
      ['gallery', 'Gallery', 'Gallery.dc.html']
    ];
    return {
      links: items.map(([k, label, href]) => ({ label, href, color: k === active ? '#fff3a8' : 'rgba(255,255,255,.82)', bg: k === active ? 'rgba(255,243,168,.1)' : 'transparent' })),
      themeIcon: this.props.theme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun',
      onToggleTheme: this.props.onToggleTheme
    };
  }
}
</script>
</body>
</html>
