<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/colors.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/typography.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/effects.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/icons.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/tokens/base.css">
  <link rel="stylesheet" href="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/styles.css">
  <script src="_ds/raylf-design-system-f4d80410-7b23-4f64-83b7-bf01b5e742f5/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:#240145;}
    a{color:#fff3a8;text-decoration:none;transition:color .2s}
    a:hover{color:#f2b84b}
    [data-theme=dark]{--t-bg:#240145;--t-fg:#fff;--t-muted:rgba(255,255,255,.78);--t-line:rgba(255,243,168,.18);--t-gold:#f2b84b;--t-sec:radial-gradient(90% 60% at 80% 35%,#6a0da4 0%,#47017e 40%,#240145 100%);--t-shadow:0 30px 80px rgba(10,0,25,.6);}
    [data-theme=light]{--t-bg:#faf8f5;--t-fg:#16121d;--t-muted:#3b3645;--t-line:rgba(53,30,93,.14);--t-gold:#a8761a;--t-sec:#efe6fb;--t-shadow:0 30px 80px rgba(30,15,56,.22);}
  </style>
</helmet>

<div data-theme="{{ theme }}" style="background:var(--t-bg);color:var(--t-fg);font-family:var(--font-body);overflow-x:clip;transition:background .4s cubic-bezier(.2,.7,.2,1),color .4s;">
  <dc-import name="RAYLF Nav" active="programmes" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" style="position:sticky;top:0;z-index:50;display:block;" hint-size="100%,84px"></dc-import>

  <section data-screen-label="Programmes Hero" style="position:relative;margin-top:-84px;min-height:72vh;display:flex;flex-direction:column;justify-content:flex-end;background:#240145;">
    <div style="position:absolute;inset:0;background:url(assets/photos/award-presentation-02.jpg) center/cover;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,1,69,.6) 0%,rgba(36,1,69,.45) 40%,rgba(36,1,69,.95) 85%,#240145 100%);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(50% 50% at 80% 30%,rgba(180,73,220,.4) 0%,rgba(180,73,220,0) 70%);"></div>
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,243,168,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,243,168,.07) 1px,transparent 1px);background-size:88px 88px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 40%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 40%,transparent 100%);"></div>
    <div style="position:relative;width:100%;max-width:1320px;margin:0 auto;padding:200px var(--container-pad) 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px;">
      <div style="display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);">
        <a href="RAYLF Website.dc.html" style="color:rgba(255,255,255,.7);">Home</a>
        <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
        <span style="color:#fff3a8;">Programmes</span>
      </div>
      <h1 style="margin:0;color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(52px,9vw,132px);line-height:.92;letter-spacing:-.04em;">Find your <span style="background:var(--gradient-gold);-webkit-background-clip:text;background-clip:text;color:transparent;">place.</span></h1>
      <p style="margin:0;max-width:640px;font-size:19px;line-height:1.6;color:rgba(255,255,255,.82);text-wrap:pretty;">Three ways RAYLF recognises, equips and connects young African leaders.</p>
    </div>
  </section>

  <section data-screen-label="Programme List" style="padding:120px var(--container-pad);">
    <div style="max-width:1320px;margin:0 auto;display:flex;flex-direction:column;">
      <sc-for list="{{ programmes }}" as="p" hint-placeholder-count="3">
        <a href="{{ p.href }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center;padding:56px 0;border-top:1px solid var(--t-line);color:var(--t-fg);" style-hover="color:var(--t-fg);">
          <div style="aspect-ratio:16/10;border-radius:var(--radius-lg);background-size:cover;background-position:center;background-image:url({{ p.img }});box-shadow:var(--t-shadow);"></div>
          <div style="display:flex;flex-direction:column;gap:20px;">
            <span style="font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.12em;color:var(--t-gold);">{{ p.n }} / {{ p.tag }}</span>
            <h2 style="margin:0;color:var(--t-fg);font-family:var(--font-display);font-weight:700;font-size:clamp(36px,4.5vw,60px);line-height:1;letter-spacing:-.03em;">{{ p.title }}</h2>
            <p style="margin:0;font-size:18px;line-height:1.7;color:var(--t-muted);max-width:520px;">{{ p.body }}</p>
            <span style="display:inline-flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--t-gold);">Read More <span style="width:40px;height:40px;border-radius:50%;border:1px solid var(--t-line);display:inline-flex;align-items:center;justify-content:center;"><i class="fa-solid fa-arrow-right"></i></span></span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Quote" style="position:relative;padding:140px var(--container-pad);text-align:center;background:#240145;color:#fff;">
    <div style="position:absolute;left:50%;top:50%;width:720px;height:720px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,243,168,.14);"></div>
    <div style="position:relative;max-width:960px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;">
      <blockquote style="margin:0;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:clamp(28px,3.4vw,46px);line-height:1.25;letter-spacing:-.015em;text-wrap:balance;">“Young Africans are the spirit, soul and memory of Africa.”</blockquote>
      <div style="width:70px;height:3px;border-radius:3px;background:var(--gradient-gold);"></div>
      <div style="font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff3a8;">His Imperial Majesty (H.I.M) Ooni of Ife</div>
    </div>
  </section>

  <x-import component-from-global-scope="RAYLFDesignSystem_f4d804.SiteFooter" hint-size="100%,320px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}">
class Component extends DCLogic {
  state = { theme: (() => { try { return localStorage.getItem('raylf-theme'); } catch (e) { return null; } })() };
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'dark';
    const light = theme === 'light';
    return {
      theme,
      toggleTheme: () => { const t = light ? 'dark' : 'light'; try { localStorage.setItem('raylf-theme', t); } catch (e) {} this.setState({ theme: t }); },
      programmes: [
        { n: '01', tag: 'Recognition', title: 'RAYLF Awards', body: 'Recognising young African leaders whose success stories are shaping the continent, presented under the patronage of His Imperial Majesty, the Ooni of Ife.', img: 'assets/photos/award-presentation-01.jpg', href: 'Awards.dc.html' },
        { n: '02', tag: 'Enterprise', title: 'G2G Millionaires', body: 'A programme equipping young founders to build enduring wealth and enterprise.', img: 'assets/photos/award-presentation-02.jpg', href: 'Programme.dc.html' },
        { n: '03', tag: 'Community', title: 'Leadership Forum', body: 'Convening young leaders under royal patronage to exchange ideas and build networks.', img: 'assets/photos/speaker-portrait.jpg', href: 'Programme.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
